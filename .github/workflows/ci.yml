name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install CI dependencies
        run: python -m pip install pytest PyYAML

      - name: Check Python syntax
        run: python -m compileall app tests

      - name: Accuracy regression gate
        run: pytest tests/test_accuracy_regression.py -v
